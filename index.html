<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spacebar Button Arcade</title>
    <!-- Google Fonts: Press Start 2P and DM Sans for retro arcade aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-ULpzZwQY.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DHEj983I.css">
    <style>
      /* Shape Tool Styles */
      .shape-tools-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.75rem;
        margin-top: 1rem;
        padding: 1rem;
        background: rgba(15, 36, 96, 0.3);
        border: 2px solid #1e3a8a;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
      }
      
      .shape-tool-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem;
        background: linear-gradient(135deg, #1e3a8a, #0f2460);
        border: 2px solid #3b82f6;
        border-radius: 4px;
        color: #e0e7ff;
        font-family: 'DM Sans', sans-serif;
        font-size: 0.65rem;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
      }
      
      .shape-tool-btn:hover {
        background: linear-gradient(135deg, #3b82f6, #1e3a8a);
        border-color: #60a5fa;
        box-shadow: 0 0 15px rgba(96, 165, 250, 0.5);
        transform: scale(1.05);
      }
      
      .shape-tool-btn.active {
        background: linear-gradient(135deg, #60a5fa, #3b82f6);
        border-color: #93c5fd;
        box-shadow: 0 0 20px rgba(147, 197, 253, 0.6);
      }
      
      .shape-tool-btn:active {
        transform: scale(0.95);
      }
      
      .shape-icon {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .shape-label {
        font-size: 0.6rem;
        text-align: center;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Shape tools initialization script
      window.addEventListener("load", function() {
        const initShapeTools = () => {
          const toolGroups = document.querySelectorAll(".tool-group");
          const paintSection = document.querySelector("section:has(.drawing-canvas)");
          const canvas = document.querySelector(".drawing-canvas");
          
          if (!canvas || toolGroups.length === 0) {
            setTimeout(initShapeTools, 500);
            return;
          }

          // Find the tool group that's in the paint section
          let correctToolGroup = null;
          toolGroups.forEach((tg) => {
            if (paintSection && paintSection.contains(tg)) {
              correctToolGroup = tg;
            }
          });

          if (!correctToolGroup || document.querySelector('.shape-tools-container')) return;

          const container = document.createElement("div");
          container.className = "shape-tools-container";
          const shapes = [
            {name:"Line",icon:"📏"},
            {name:"Circle",icon:"⭕"},
            {name:"Rectangle",icon:"▭"},
            {name:"Triangle",icon:"△"},
            {name:"Heart",icon:"❤"},
            {name:"Text",icon:"✍"},
            {name:"Star",icon:"⭐"},
            {name:"Diamond",icon:"◇"}
          ];

          shapes.forEach(s => {
            const btn = document.createElement("button");
            btn.className = "shape-tool-btn";
            btn.innerHTML = `<div class="shape-icon">${s.icon}</div><div class="shape-label">${s.name}</div>`;
            btn.addEventListener("click", function() {
              document.querySelectorAll(".shape-tool-btn").forEach(b => b.classList.remove("active"));
              btn.classList.add("active");
              window.currentShape = s.name.toLowerCase();
            });
            container.appendChild(btn);
          });

          correctToolGroup.parentElement.insertBefore(container, correctToolGroup.nextElementSibling);

          let isDrawing = false;
          let startPos = {x: 0, y: 0};
          let currentPos = {x: 0, y: 0};

          canvas.addEventListener("mousedown", function(e) {
            if (!window.currentShape) return;
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            startPos = {x: e.clientX - rect.left, y: e.clientY - rect.top};
          });

          canvas.addEventListener("mousemove", function(e) {
            if (!isDrawing || !window.currentShape) return;
            const rect = canvas.getBoundingClientRect();
            currentPos = {x: e.clientX - rect.left, y: e.clientY - rect.top};
          });

          canvas.addEventListener("mouseup", function() {
            if (!isDrawing || !window.currentShape) return;
            isDrawing = false;
            const ctx = canvas.getContext("2d");
            const color = window.currentColor || "#ff0000";
            const size = window.currentSize || 5;
            
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = size;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            const x1 = startPos.x, y1 = startPos.y, x2 = currentPos.x, y2 = currentPos.y;

            switch(window.currentShape) {
              case "line":
                ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
                break;
              case "circle":
                const r = Math.sqrt((x2-x1)**2 + (y2-y1)**2);
                ctx.beginPath(); ctx.arc(x1, y1, r, 0, 2*Math.PI); ctx.stroke();
                break;
              case "rectangle":
                ctx.strokeRect(x1, y1, x2-x1, y2-y1);
                break;
              case "triangle":
                ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x1-(x2-x1), y2); ctx.closePath(); ctx.stroke();
                break;
              case "heart":
                const w = Math.abs(x2-x1), h = Math.abs(y2-y1);
                ctx.beginPath(); ctx.moveTo(x1, y1+h/4);
                ctx.quadraticCurveTo(x1-w/2, y1-h/4, x1-w/2, y1);
                ctx.quadraticCurveTo(x1-w/2, y1-h/2, x1, y1-h/4);
                ctx.quadraticCurveTo(x1+w/2, y1-h/2, x1+w/2, y1);
                ctx.quadraticCurveTo(x1+w/2, y1-h/4, x1, y1+h/4);
                ctx.closePath(); ctx.stroke();
                break;
              case "text":
                const fs = Math.max(12, Math.abs(x2-x1)/3);
                ctx.font = `${fs}px Arial`; ctx.fillText("Text", x1, y1);
                break;
              case "star":
                const sr = Math.sqrt((x2-x1)**2 + (y2-y1)**2);
                ctx.beginPath();
                for(let i=0; i<10; i++) {
                  const rad = i%2===0 ? sr : sr/2;
                  const ang = Math.PI/5*i - Math.PI/2;
                  ctx.lineTo(x1+rad*Math.cos(ang), y1+rad*Math.sin(ang));
                }
                ctx.closePath(); ctx.stroke();
                break;
              case "diamond":
                ctx.beginPath(); ctx.moveTo((x1+x2)/2, y1); ctx.lineTo(x2, (y1+y2)/2); ctx.lineTo((x1+x2)/2, y2); ctx.lineTo(x1, (y1+y2)/2); ctx.closePath(); ctx.stroke();
                break;
            }
          });
        };
        initShapeTools();
      });
    </script>
  </body>
</html>
