<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spacebar Button Arcade</title>
    <!-- Google Fonts: Press Start 2P and DM Sans for retro arcade aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-ULpzZwQY.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DHEj983I.css">
    <style>
      /* Shape Tool Styles */
      .shape-tools-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.75rem;
        margin-top: 1rem;
        padding: 1rem;
        background: rgba(15, 36, 96, 0.3);
        border: 2px solid #1e3a8a;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
      }
      
      .shape-tool-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem;
        background: linear-gradient(135deg, #1e3a8a, #0f2460);
        border: 2px solid #3b82f6;
        border-radius: 4px;
        color: #e0e7ff;
        font-family: 'DM Sans', sans-serif;
        font-size: 0.65rem;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
      }
      
      .shape-tool-btn:hover {
        background: linear-gradient(135deg, #3b82f6, #1e3a8a);
        border-color: #60a5fa;
        box-shadow: 0 0 15px rgba(96, 165, 250, 0.5);
        transform: scale(1.05);
      }
      
      .shape-tool-btn.active {
        background: linear-gradient(135deg, #60a5fa, #3b82f6);
        border-color: #93c5fd;
        box-shadow: 0 0 20px rgba(147, 197, 253, 0.6);
      }
      
      .shape-tool-btn:active {
        transform: scale(0.95);
      }
      
      .shape-icon {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .shape-label {
        font-size: 0.6rem;
        text-align: center;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
